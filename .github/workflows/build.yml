# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "v6.1" branch
  push:
    branches: [ "v6.1" ]
  pull_request:
    branches: [ "v6.1" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-2019

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - name: Cache AutoIt
      id: cache-AutoIt
      uses: actions/cache@v4
      with:
        path: "C:/Program Files (x86)/AutoIt3/"
        key: ${{ runner.os }}-autoit_v3.3.16.1

    # Runs a single command using the runners shell
    - name: Install AutoIt
      if: steps.cache-AutoIt.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest -Uri https://www.autoitscript.com/cgi-bin/getfile.pl?autoit3/autoit-v3-setup.exe -OutFile autoit-v3-setup.exe
        ./autoit-v3-setup.exe /S

    # Runs a single command using the runners shell
    - name: replace github_sha
      run: sed -i -e '/^#pragma /s/!github_sha!/${{ github.sha }}/' source/Portable-VirtualBox.au3
      shell: bash

    # Runs a single command using the runners shell
    - name: build.bat
      run: build.bat
      shell: cmd

    # Runs a single command using the runners shell
    - name: zip
      run: |
        cd build/source/Portable-VirtualBox
        7z a -tzip ../../../Portable-VirtualBox.zip *
      shell: cmd

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Portable-virtualbox_build_${{ github.sha }}
        path: build/source/Portable-VirtualBox/**

    - name: Deploy Windows release
      uses: WebFreak001/deploy-nightly@v3.1.0
      with:
        upload_url: https://uploads.github.com/repos/bitamind/Portable-VirtualBox/releases/182074918/assets{?name,label} # find out this value by opening https://api.github.com/repos/<owner>/<repo>/releases in your browser and copy the full "upload_url" value including the {?name,label} part
        release_id: 182074918 # same as above (id can just be taken out the upload_url, it's used to find old releases)
        asset_path: ./Portable-VirtualBox.zip # path to archive to upload
        asset_name: Portable-VirtualBox_$$.zip # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
        asset_content_type: application/zip # required by GitHub API
        #max_releases: 7 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted
